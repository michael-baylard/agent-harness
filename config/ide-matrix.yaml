# Source of truth for IDE feature parity (native vs adapted).
# Regenerate ides/* via scripts/build-ides.ps1 · Live matrix: klarix.ai/harness/ides
# Last updated: 2026-09-09

# native  = IDE feature, harness tested
# adapted = harness ships files + docs; workflow differs (e.g. delegate briefs vs subagent router)
# none    = platform gap (avoid on matrix when adapted kit exists)

ides:
  cursor:
    tier: auto-routing
    install_path: ".cursor/rules/*.mdc · .cursor/skills/ · .cursor/agents/ · mcp.json"
    rules: native
    skills: native
    mcp_profiles: native
    subagents: native

  codex:
