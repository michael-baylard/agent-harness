name: verify-team-policy

on:
  push:
    paths:
      - "config/team-policy.yaml"
      - "scripts/verify-team-policy.ps1"
      - "docs/team-policy-layer.md"
  pull_request:
    paths:
      - "config/team-policy.yaml"
      - "scripts/verify-team-policy.ps1"
      - "docs/team-policy-layer.md"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify team-policy.yaml
        shell: pwsh
        run: pwsh -File scripts/verify-team-policy.ps1
